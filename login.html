
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-Cricle | Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">U-CRICLE</a>
    <a href="index.html">Home</a>
  </div>
</header>

<main class="form-box">
  <h2>Create Your Account</h2>

  <form id="registerForm">
    <input type="text" id="fullName" placeholder="Full Name" required>

    <input type="tel" id="phone" placeholder="Mobile Number" required>

    <input type="email" id="email" placeholder="Gmail Address" required>

    <input type="password" id="password" placeholder="Password" minlength="8" required>

    <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="8" required>

    <button type="submit" class="btn">Register</button>
  </form>

  <p style="margin-top:20px; text-align:center;">
    Already have an account?
    <a href="#login" style="color:#16c784;">Login</a>
  </p>

  <div id="login" style="margin-top:30px;">
    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" placeholder="Gmail Address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>

  <p id="message" style="margin-top:15px; color:#16c784;"></p>

  <p style="margin-top:20px; color:#aab8cc; font-size:13px;">
    Demo only: This page does not create secure accounts or store passwords.
  </p>
</main>

<footer class="footer">
  U-Cricle Demo Platform
</footer>

<script>
const registerForm = document.getElementById("registerForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

registerForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match!";
    return;
  }

  message.textContent =
    "Demo only: Secure registration backend is not connected.";
});

loginForm.addEventListener("submit", function(event) {
  event.preventDefault();

  message.textContent =
    "Demo only: Secure login backend is not connected.";
});
</script>

</body>
</html>
